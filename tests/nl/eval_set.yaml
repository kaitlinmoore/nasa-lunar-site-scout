# SI-assisted: generated with Claude (Anthropic) and reviewed by the project author. See README "AI usage".
#
# NL eval set. Loaded and validated by lss.nl.evalset.
#
# Provenance (SI rule):
#   source: kaitlin      -> the project author's example queries, verbatim, with the project author's
#                           expected outcomes (labels the project author edited).
#   source: si_supplied  -> Claude-drafted queries the project author approved (s1-s16, 2026-11-15).
#
# Fields:
#   target         the target label (the outcome once every needed feature exists)
#   status         ready: scored now. blocked: listed with what it waits for; run but not scored.
#   split          dev (default): used for prompt tuning. holdout: never used for tuning; scored
#                  separately (project author, 2026-11-15). Prompt changes must be general rules,
#                  never written around a specific item. Holdout: s3, s5, s8, s16 (chosen after live
#                  run 2, whose outputs had been seen; clean from run 3 on) and s11 (never run;
#                  replaced s13 on 2026-11-15 because s13's label changed after its output was seen).
#                  s11 became ready when the registry batch merged (03d24f4).
#   blocked_on     ids of what an item waits for, by prefix (lss.nl.evalset.BLOCKER_KINDS):
#                    C*    a contract change (none open: added in contracts 0.7.0 and 0.10.0; a thermal
#                          operation is not planned, so the temperature item is labelled unsupported)
#                    G-R*  a registry change (none open: merged as 03d24f4)
#                    D-*   a default the project author hasn't decided yet (none open: the default height,
#                          window, "safe" slope and "nearby" radius were all decided 2026-11-15)
#   expected       what a correct NL output is under the current contract + vocabulary:
#     outcome      answer | partial | unsupported | clarify (asks the user, e.g. for a site)
#     query        {operation, params}; locations may be {site_id: ...}
#     params_match exact (default) | subset (only the keys given are checked)
#     height_source  see lss.nl.vocabulary.HeightSource
#     window_source  see lss.nl.vocabulary.WindowSource (ranking_default: the precomputed 2028 year)
#     slope_source   see lss.nl.vocabulary.SlopeSource ("safe" with no limit -> 5 degrees, D-safe)
#     radius_source  see lss.nl.vocabulary.RadiusSource ("nearby" with no distance -> 10 km, D-radius)
#     site_source    see lss.nl.vocabulary.SiteSource (no site named + a site selected -> selected_site)
#     citations    registry citations that must be present
#     citations_optional  registry citations that may also be present without penalty
#     citations_one_of    groups: at least one citation of each group must be present

version: 1
reference_date: "2026-11-15"  # "today" for relative dates, so runs are reproducible

items:
  - id: k1
    source: kaitlin
    text: What can we learn from this site and the surrounding location?
    context: {selected_site_id: pgda-site01}
    target: "Answer: site summary (metrics + nearby features)."
    status: ready
    notes: >-
      site_summary (contract 0.7.0, the project author's choice for this query). "Surrounding" with no
      distance is the "nearby" default (10 km); the metrics part uses the default height and window (no
      scenario selected), all disclosed by code.
    expected:
      outcome: answer
      height_source: default
      window_source: default
      radius_source: nearby_default
      site_source: selected_site
      query:
        operation: site_summary
        params:
          location: {site_id: pgda-site01}
          radius_m: 10000.0
          scenario:
            location: {site_id: pgda-site01}
            unit_height_m: 5.0
            window_start: "2026-11-15T00:00:00Z"
            window_end: "2026-12-15T00:00:00Z"

  - id: k1-no-site
    source: kaitlin
    text: What can we learn from this site and the surrounding location?
    context: {}
    target: "Asks for a site, since none is selected (the second half of label #1)."
    status: ready
    notes: Same query as k1 with no site selected; the label covers both cases (NLClarification).
    expected:
      outcome: clarify

  - id: k2
    source: kaitlin
    text: How steep is the terrain?
    context: {selected_site_id: pgda-site01}
    target: "Answer: slope at and around the site."
    status: ready
    notes: terrain. No distance given, so "around" is the 1 km default, disclosed by code.
    expected:
      outcome: answer
      radius_source: around_default
      site_source: selected_site
      query:
        operation: terrain
        params:
          location: {site_id: pgda-site01}
          radius_m: 1000.0

  - id: k3
    source: kaitlin
    text: Where are the nearby hazards?
    context: {selected_site_id: pgda-site01}
    target: >-
      Partial: slopes, PGDA polar roughness maps, craters >=1-2 km. States that boulder data doesn't
      cover the pole.
    status: ready
    notes: >-
      site_summary restricted to hazard features, so the answer has slopes and craters together (the
      project author's site_summary choice covers this query as a partial). "Nearby" with no distance is
      10 km, disclosed by code; features closest first, at most 10, with the total.
    expected:
      outcome: partial
      radius_source: nearby_default
      site_source: selected_site
      query:
        operation: site_summary
        params:
          location: {site_id: pgda-site01}
          radius_m: 10000.0
          feature_types: [crater, hazard]
      citations:
        - {dataset_id: aussel_2025_boulders, cannot_answer: Any boulder information at the poles}
      citations_optional:
        - {dataset_id: robbins_craters, cannot_answer: Craters smaller than ~1 km}
        - {dataset_id: pgda_98_polar_roughness, cannot_answer: Individual boulders or meter-scale hazards}

  - id: k4
    source: kaitlin
    text: >-
      Show me all regions within 6 degrees of the lunar south pole that have at least 100 square meters
      of flat terrain with a slope under 5 degrees.
    context: {}
    target: >-
      Partial: answerable only within the 5 m mosaic (87-90 S), and low-confidence even there because
      ~90% of 5 m pixels are interpolated (Barker). Elsewhere, 100 m2 is smaller than one pixel and the
      tool says so.
    status: ready
    notes: A polar cap area; the pixel-size and interpolation limits are the registry's merged wording.
    expected:
      outcome: partial
      slope_source: user
      query:
        operation: search
        params:
          area: {kind: cap, pole: south, max_colatitude_deg: 6}
          criteria: {max_slope_deg: 5, min_flat_area_m2: 100}
      citations:
        - dataset_id: pgda_81_mosaic_5m
          cannot_answer: High-confidence single-pixel slope (~90% of 5 m pixels are interpolated)
        - dataset_id: pgda_90_south_pole_dems
          cannot_answer: Flat areas smaller than one pixel (20 m pixel = 400 m²) equatorward of 87°S
      citations_optional:
        - {dataset_id: pgda_81_mosaic_5m, cannot_answer: Terrain equatorward of 87 S}

  - id: k5
    source: kaitlin
    text: Which candidate sites have zero boulders larger than 0.5 meters within a 50-meter landing ellipse?
    context: {}
    target: "Refusal: below any dataset's resolution; no boulder map covers the pole."
    status: ready
    expected:
      outcome: unsupported
      citations:
        - dataset_id: pgda_81_mosaic_5m
          cannot_answer: Hazards smaller than a few pixels (e.g. sub-meter boulders)
        - {dataset_id: aussel_2025_boulders, cannot_answer: Any boulder information at the poles}
      citations_optional:
        - {dataset_id: aussel_2025_boulders, cannot_answer: Individual sub-meter boulders in a landing ellipse}
        - {dataset_id: pgda_98_polar_roughness, cannot_answer: Individual boulders or meter-scale hazards}

  - id: k6
    source: kaitlin
    text: >-
      Find all safe landing zones in the Shackleton crater region that will experience continuous sunlight
      for at least 10 Earth days starting on November 15, 2028.
    context: {}
    target: >-
      Before time-dependent area search exists: answer for curated sites in the region and say area
      search isn't available yet. Echo how "safe" was interpreted (slope limit).
    status: ready
    notes: >-
      Filter and rank on compare (contract 0.10.0) with the project author's design choices (2026-11-16):
      "continuous sunlight for at least 10 days starting 15 Nov" = no shadow in 2028-11-15 + 10 days; the
      Shackleton region is a site region tag; "safe" = slope at the site's point < 5 degrees (the "safe"
      default), the echo naming the map. No height given: the 5 m lander proxy (the default height). Curated
      sites only (area search not available).
    expected:
      outcome: partial
      height_source: default
      window_source: user
      slope_source: safe_default
      query:
        operation: compare
        params:
          across:
            region: shackleton
            unit_height_m: 5.0
            window_start: "2028-11-15T00:00:00Z"
            window_days: 10
          filters:
            - {metric: power.shadow_count, op: eq, value: 0}
            - {metric: terrain.slope_at_point_deg, op: lt, value: 5.0}
      citations:
        - {dataset_id: lss_tool_capabilities, cannot_answer: Time-dependent area search (not available yet)}

  - id: k7
    source: kaitlin
    text: >-
      Rank the top five sites where the Sun angle during descent is between 10 and 25 degrees so our
      optical hazard-detection cameras have optimal contrast.
    context: {}
    target: >-
      Answer for curated/saved sites; echo the assumed date; note it is Sun elevation at the site, not
      along the approach trajectory.
    status: ready
    notes: >-
      Filter and rank on compare (contract 0.10.0) with the project author's design choices (2026-11-16): a
      ranking with no dates uses the precomputed 2028 year (disclosed); rank by the fraction of time with the
      Sun at 10-25 degrees, after dropping sites with none; top five; all curated sites; 5 m lander proxy (the
      default height).
    expected:
      outcome: partial
      height_source: default
      window_source: ranking_default
      query:
        operation: compare
        params:
          across:
            unit_height_m: 5.0
            window_start: "2028-01-01T00:00:00Z"
            window_end: "2029-01-01T00:00:00Z"
            step: PT6H
          filters:
            - metric: {min_deg: 10, max_deg: 25}
              op: gt
              value: 0
          rank:
            metric: {min_deg: 10, max_deg: 25}
            order: desc
            limit: 5
      citations:
        - dataset_id: lss_tool_capabilities
          cannot_answer: Sun angle along a descent trajectory (Sun elevation is computed at the site)

  - id: k8
    source: kaitlin
    text: >-
      Which high-latitude sites stay warm enough during the lunar night to reduce our battery heating
      requirements by 20 percent?
    context: {}
    target: >-
      Partial: night temperatures where polar Diviner products apply (poleward of 80). For 60-80, state
      that the tool has no temperature product for that range. Refuse the 20% part (needs a spacecraft
      thermal model).
    status: ready
    notes: >-
      Unsupported (not partial) until a thermal operation exists: the Core vocabulary has no temperature
      query. The Diviner range citation uses the registry wording the project author approved. Either it or
      the tool's temperature limit is accepted (the project author, 2026-11-16, after live run 4).
    expected:
      outcome: unsupported
      citations:
        - dataset_id: diviner_polar_temperature
          cannot_answer: Spacecraft thermal or battery-heating requirements (needs a spacecraft thermal model)
      citations_one_of:
        - - dataset_id: diviner_polar_temperature
            cannot_answer: >-
              Temperatures equatorward of 80° (the tool has not integrated a Diviner product for that range)
          - {dataset_id: lss_tool_capabilities, cannot_answer: Temperature queries (not available yet)}

  - id: k9
    source: kaitlin
    text: >-
      Recommend a safe landing zone within a 1-kilometer drive of a permanently shadowed region that shows
      high hydrogen signatures.
    context: {}
    target: >-
      Partial: PSR distance (straight-line, not a drive route). State that hydrogen data is too coarse
      for 1 km, and offer M3 surface-ice detections (~280 m) as a clearly labeled stand-in.
    status: ready
    notes: >-
      The "safe" default was decided 2026-11-15 (slope under 5 degrees; the echo names the terrain data). The
      1 km is the user's own distance, so radius_source is user, not the "nearby" default. No region named, so
      the area is "all" (the project author's choice). Hydrogen and drive-route limits: the registry's merged
      wording.
    expected:
      outcome: partial
      slope_source: safe_default
      radius_source: user
      query:
        operation: search
        params:
          area: {kind: all}
          criteria:
            max_slope_deg: 5.0
            near_feature_types: [psr, ice_detection]
            max_feature_distance_m: 1000
      citations:
        - dataset_id: orbital_neutron_hydrogen
          cannot_answer: Hydrogen concentration at ~1 km scale (orbital neutron maps resolve ~10 km at best)
        - {dataset_id: lss_tool_capabilities, cannot_answer: Drive routes or traverse distances (distances are straight-line)}
      citations_optional:
        - dataset_id: m3_surface_ice
          cannot_answer: Subsurface hydrogen at km scale (neutron data are far coarser)

  # ---- SI-supplied items: drafted by Claude, approved by the project author 2026-11-15
  #      (s1-s15, plus s16 for the defaults).
  #      Date convention (project author, 2026-11-15): a named end date includes that day,
  #      so the window ends at 00:00 UTC the next day; "during <month>" is the whole month.

  - id: s1
    source: si_supplied
    text: How much sunlight will Connecting ridge get at 2 m height from December 1 to December 31, 2028?
    target: "Answer: power metrics at Site01, 2 m, all of December 2028."
    status: ready
    expected:
      outcome: answer
      height_source: user
      window_source: user
      query:
        operation: metrics
        params:
          scenario:
            location: {site_id: pgda-site01}
            unit_height_m: 2.0
            window_start: "2028-12-01T00:00:00Z"
            window_end: "2029-01-01T00:00:00Z"

  - id: s2
    source: si_supplied
    text: What fraction of the time can a lander at Connecting ridge see Earth during January 2029?
    target: "Answer: comms metrics at Site01 at the lander proxy height (disclosed), January 2029."
    status: ready
    expected:
      outcome: answer
      height_source: lander_proxy
      window_source: user
      query:
        operation: metrics
        params:
          scenario:
            location: {site_id: pgda-site01}
            unit_height_m: 5.0
            window_start: "2029-01-01T00:00:00Z"
            window_end: "2029-02-01T00:00:00Z"

  - id: s3
    source: si_supplied
    split: holdout
    text: When does the Sun set at Connecting ridge between November 15 and December 15, 2028, for a rover?
    target: "Answer: sunset events at Site01 at the rover proxy height (disclosed)."
    status: ready
    expected:
      outcome: answer
      height_source: rover_proxy
      window_source: user
      query:
        operation: series
        params:
          scenario:
            location: {site_id: pgda-site01}
            unit_height_m: 1.0
            window_start: "2028-11-15T00:00:00Z"
            window_end: "2028-12-16T00:00:00Z"

  - id: s4
    source: si_supplied
    text: Compare Earth visibility at Connecting ridge for 1 m and 10 m heights during November 2028.
    target: "Answer: compare two heights at Site01, November 2028."
    status: ready
    expected:
      outcome: answer
      height_source: user
      window_source: user
      query:
        operation: compare
        params:
          scenarios:
            - location: {site_id: pgda-site01}
              unit_height_m: 1.0
              window_start: "2028-11-01T00:00:00Z"
              window_end: "2028-12-01T00:00:00Z"
            - location: {site_id: pgda-site01}
              unit_height_m: 10.0
              window_start: "2028-11-01T00:00:00Z"
              window_end: "2028-12-01T00:00:00Z"

  - id: s5
    source: si_supplied
    split: holdout
    text: Compare Connecting ridge in November 2028 versus May 2029 at 2 m.
    target: "Answer: compare two windows at Site01, 2 m."
    status: ready
    expected:
      outcome: answer
      height_source: user
      window_source: user
      query:
        operation: compare
        params:
          scenarios:
            - location: {site_id: pgda-site01}
              unit_height_m: 2.0
              window_start: "2028-11-01T00:00:00Z"
              window_end: "2028-12-01T00:00:00Z"
            - location: {site_id: pgda-site01}
              unit_height_m: 2.0
              window_start: "2029-05-01T00:00:00Z"
              window_end: "2029-06-01T00:00:00Z"

  - id: s6
    source: si_supplied
    text: Show me the horizon from Connecting ridge at 2 m.
    target: "Answer: horizon profile at Site01, 2 m."
    status: ready
    expected:
      outcome: answer
      height_source: user
      window_source: not_applicable
      query:
        operation: horizon
        params:
          location: {site_id: pgda-site01}
          unit_height_m: 2.0

  - id: s7
    source: si_supplied
    text: List the Apollo landing sites.
    target: "Answer: curated sites, category apollo."
    status: ready
    expected:
      outcome: answer
      query:
        operation: sites
        params: {category: apollo}

  - id: s8
    source: si_supplied
    split: holdout
    text: What terrain data covers 85°S, 30°E, and how detailed is it?
    target: "Answer: terrain stack and fidelity at a custom point."
    status: ready
    expected:
      outcome: answer
      query:
        operation: locate
        params: {lat: -85.0, lon: 30.0}

  - id: s9
    source: si_supplied
    text: Which craters are within 10 km of Connecting ridge?
    target: "Partial: craters within 10 km; the crater catalog is complete only above ~1-2 km."
    status: ready
    expected:
      outcome: partial
      radius_source: user  # 10 km is the user's own distance (it happens to equal the "nearby" default)
      query:
        operation: proximity
        params:
          location: {site_id: pgda-site01}
          types: [crater]
          radius_m: 10000.0
      citations:
        - {dataset_id: robbins_craters, cannot_answer: Craters smaller than ~1 km}

  - id: s10
    source: si_supplied
    text: Find flat spots with slope under 10° within 2 km of Connecting ridge.
    target: "Partial: terrain-only search around a site."
    status: ready
    notes: >-
      A circle area around the site. The partial's citation (the 5 m interpolation limit, as in k4)
      is Claude-drafted, approved by the project author (2026-11-16).
    expected:
      outcome: partial
      slope_source: user
      radius_source: user
      query:
        operation: search
        params:
          area: {kind: circle, center: {site_id: pgda-site01}, radius_m: 2000.0}
          criteria: {max_slope_deg: 10.0}
      citations:
        - dataset_id: pgda_81_mosaic_5m
          cannot_answer: High-confidence single-pixel slope (~90% of 5 m pixels are interpolated)

  - id: s11
    source: si_supplied
    split: holdout
    text: What will the temperature be at Connecting ridge on January 1, 2029 at noon?
    target: "Unsupported: temperature queries are not supported yet (tool limit)."
    status: ready
    expected:
      outcome: unsupported
      citations:
        - {dataset_id: lss_tool_capabilities, cannot_answer: Temperature queries (not available yet)}

  - id: s12
    source: si_supplied
    text: How much sunlight will Connecting ridge get in 2055?
    target: "Unsupported: after the ephemeris kernels' end (2050)."
    status: ready
    expected:
      outcome: unsupported
      citations:
        - dataset_id: spice_de421
          cannot_answer: >-
            Dates after 2050-12-31 23:58:50 UTC (orientation kernel end); needs newer kernels + frame
            alignment

  - id: s13
    source: si_supplied
    text: How much water ice is in Shackleton crater?
    target: "Unsupported: no dataset gives ice abundance or depth."
    status: ready
    expected:
      outcome: unsupported
      citations:
        - {dataset_id: m3_surface_ice, cannot_answer: Ice abundance or depth}
      citations_optional:  # project author, 2026-11-15: this extra citation is acceptable
        - dataset_id: m3_surface_ice
          cannot_answer: Subsurface hydrogen at km scale (neutron data are far coarser)

  - id: s14
    source: si_supplied
    text: Plan a drive route for a rover from Connecting ridge to the nearest permanently shadowed region.
    target: "Unsupported: drive routes are a tool limit (distances are straight-line)."
    status: ready
    notes: Approved as unsupported; a partial (straight-line PSR distance) is the alternative.
    expected:
      outcome: unsupported
      citations:
        - {dataset_id: lss_tool_capabilities, cannot_answer: Drive routes or traverse distances (distances are straight-line)}

  - id: s15
    source: si_supplied
    text: What's the weather like on Mars?
    target: "Unsupported: outside lunar landing-site planning (tool limit)."
    status: ready
    expected:
      outcome: unsupported
      citations:
        - {dataset_id: lss_tool_capabilities, cannot_answer: Questions outside lunar landing-site planning}

  - id: s16
    source: si_supplied
    split: holdout
    text: How much sun does Connecting ridge get?
    target: "Answer: power metrics at Site01 with the default height and window, both disclosed."
    status: ready
    expected:
      outcome: answer
      height_source: default
      window_source: default
      query:
        operation: metrics
        params:
          scenario:
            location: {site_id: pgda-site01}
            unit_height_m: 5.0
            window_start: "2026-11-15T00:00:00Z"
            window_end: "2026-12-15T00:00:00Z"
