  # McClernan (2024), doi:10.5066/P1MEQ6UK (ScienceBase item 671a6fa8d34efed5620f89f8), read from each zip's
  # <stem>_PolarLGRS_ACC_1km_S_Grid.shp header (= the dbf ULX/LRX/ULY/LRY extent; full rectangles of 1 km cells).
  # The grid's .prj: stereographic, latitude of origin -90, central meridian 0, scale factor 0.994, false
  # easting/northing 500 km, 1737.4 km sphere; so engine PS metres = (LPS - 500 km) / 0.994. The inverse is
  # checked against the bounds published in each region's 1 km XML (tests/engine/test_sites_artemis.py).
  # VERIFY: the frame of the USGS grids (not stated; LROC QuickMap regions, mean Earth assumed). No `point`:
  # these are not product 78 tile sites. Wording approved by Kaitlin 2026-11-16 (short names end in " region"
  # to stay distinct from the curated sites). docs/methodology.md section 1.4.3.
