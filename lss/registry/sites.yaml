  # Site06, Site20, Site23, Site42: the sentences on the 5 m map in 2028 answer the G2 review (M3; M2 for
  # Site20). Every number in them is pinned to the served files, the 5 m maps and A's validation fixture by
  # tests/engine/test_sites_mazarico_text.py. Wording approved by Kaitlin 2026-11-16.
  - id: pgda-site06
    name: Site06 Nobile rim 1 (Mazarico 2011 site 6)
    short_name: Nobile Rim
    subtitle: PGDA Site06 · Mazarico 2011 rank 6
    category: pgda
    location: {lat: -85.30, lon: 37.07}
    point: {rule: mazarico_2011, tile: Site06, ps_m: [85957.726, 113780.267], centroid_from: "Mazarico et al. (2011) Table 3, rank 6"}
    description: >-
      A point on the rim of Nobile crater, about 143 km from the Moon's south pole. Mazarico et al. (2011)
      listed the 50 most illuminated spots near the south pole on a 240 m map; this one ranks 6th, with 86% of
      the Sun's disc in view on average at surface level over 1970-2044. Barker et al. (2021) made the 5 m map
      of the site (PGDA product 78) that is used here. The point is Mazarico's published coordinate, given to
      0.01 degrees (about 300 m in latitude). On the 5 m map used here, the point is on an 8° slope. The Sun
      never rises more than about 6° above the horizon here, and close to the ground the slope beside the
      point hides it: in 2028, at 1 m above the ground, 41% of the Sun's disc is in view on average (some of
      the Sun is in view 47% of the time), rising to 83% at 5 m and 87% at 10 m. Mazarico's 240 m map is too
      coarse to show this slope; repeating their method on a 240 m map gives 87% at 10 m, close to their 87%.
    dataset_ids: [pgda_78_site_dems, pgda_90_south_pole_dems]
    has_dem_clones: true
    source: >-
      Mazarico, E., et al. (2011), Icarus 211, 1066-1081, doi:10.1016/j.icarus.2010.10.030, Table 3
      (south pole, rank 6): 37.07 E, 85.30 S (polar stereographic x = 85.958 km,
      y = 113.780 km on the 1737.4 km sphere). Site name and 5 m map: PGDA product 78 (Barker, M. K.,
      et al. (2021), Planet. Space Sci. 203, 105119, doi:10.1016/j.pss.2020.105119).

  # Site20 description: the published-coordinate check (Kaitlin's rule, 2026-11-16; scripts/mazarico_node.py,
  # docs/methodology.md section 1.4.1). Wording approved by Kaitlin 2026-11-16.
  - id: pgda-site20
    name: Site20 Leibnitz beta plateau (Mazarico 2011 site 20)
    short_name: Leibnitz Beta Plateau
    subtitle: PGDA Site20 · Mazarico 2011 rank 20
    category: pgda
    location: {lat: -85.43, lon: 31.73}
    point: {rule: mazarico_2011, tile: Site20, ps_m: [72919.046, 117927.84], centroid_from: "Mazarico et al. (2011) Table 3, rank 20"}
    description: >-
      A point on the Leibnitz beta plateau, about 139 km from the Moon's south pole. Mazarico et al. (2011)
      listed the 50 most illuminated spots near the south pole on a 240 m map; this one ranks 20th, with 82%
      of the Sun's disc in view on average at surface level over 1970-2044. Barker et al. (2021) made the 5 m
      map of the site (PGDA product 78) that is used here. The point is Mazarico's published coordinate, given
      to 0.01 degrees (about 300 m in latitude). On the maps used here, this coordinate lies on the side of
      the plateau rather than its best-lit ground. Repeating Mazarico's method there gives about 25% of the
      Sun's disc in view at surface level (46% at 10 m), against their 82% (83%). The two nearest points of a
      240 m grid, 85 and 158 m away, do no better than 58% at 10 m, so the published coordinate is kept. On
      the 5 m map in 2028, 14% of the Sun's disc is in view on average at 1 m above the ground (some of the
      Sun is in view 17% of the time) and 30% at 10 m. Results for this site describe that point.
    dataset_ids: [pgda_78_site_dems, pgda_90_south_pole_dems]
    has_dem_clones: true
    source: >-
      Mazarico, E., et al. (2011), Icarus 211, 1066-1081, doi:10.1016/j.icarus.2010.10.030, Table 3
      (south pole, rank 20): 31.73 E, 85.43 S (polar stereographic x = 72.919 km,
      y = 117.928 km on the 1737.4 km sphere). Site name and 5 m map: PGDA product 78 (Barker, M. K.,
      et al. (2021), Planet. Space Sci. 203, 105119, doi:10.1016/j.pss.2020.105119).

  - id: pgda-site23
    name: Site23 Malapert massif (Mazarico 2011 site 23)
    short_name: Malapert Massif
    subtitle: PGDA Site23 · Mazarico 2011 rank 23
    category: pgda
    location: {lat: -85.97, lon: -2.30}
    point: {rule: mazarico_2011, tile: Site23, ps_m: [-4906.252, 122155.02], centroid_from: "Mazarico et al. (2011) Table 3, rank 23"}
    description: >-
      A point on the Malapert massif, about 122 km from the Moon's south pole. Mazarico et al. (2011) listed
      the 50 most illuminated spots near the south pole on a 240 m map; this one ranks 23rd, with 82% of the
      Sun's disc in view on average at surface level over 1970-2044. Mazarico et al. (2011) also note that
      high ground such as Mons Malapert has good visibility of the Earth. Barker et al. (2021) made the 5 m
      map of the site (PGDA product 78) that is used here. The point is Mazarico's published coordinate, given
      to 0.01 degrees (about 300 m in latitude). On the 5 m map used here, the point is on a 7° slope. The Sun
      never rises more than about 6° above the horizon here, and close to the ground the slope beside the
      point hides it: in 2028, at 1 m above the ground, 45% of the Sun's disc is in view on average (some of
      the Sun is in view 52% of the time), rising to 67% at 2 m and 82% at 5 m and 10 m. Mazarico's 240 m map
      is too coarse to show this slope; repeating their method on a 240 m map gives 82% at 10 m, close to
      their 83%. The Earth is in view 51% of 2028 at 1 m and 82% at 10 m, the most of the eight PGDA sites at
      that height.
    dataset_ids: [pgda_78_site_dems, pgda_90_south_pole_dems]
    has_dem_clones: true
    source: >-
      Mazarico, E., et al. (2011), Icarus 211, 1066-1081, doi:10.1016/j.icarus.2010.10.030, Table 3
      (south pole, rank 23): 357.70 E, 85.97 S (polar stereographic x = -4.906 km,
      y = 122.155 km on the 1737.4 km sphere). Site name and 5 m map: PGDA product 78 (Barker, M. K.,
      et al. (2021), Planet. Space Sci. 203, 105119, doi:10.1016/j.pss.2020.105119).

