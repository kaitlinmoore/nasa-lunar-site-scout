  # Apollo landing sites (Kaitlin, 2026-11-16): the Lunar Module descent stage position from Wagner et al. (2017),
  # LROC NAC images, read from the LROC PDS archive table (LRO-L-LROC-5-RDR-V1.0, ANTHROPOGENIC_OBJECTS, DBF field
  # LONGITUDE in -180..180) and identical on NASA NSSDCA's Apollo Landing Site Coordinates page ("planetocentric Mean
  # Earth/Polar Axis Lunar Reference System - DE421 ephemeris"): the engine's MOON_ME / DE421 frame. Uncertainty is
  # the table's "Uncertainty (m)" column. Place names and UT landing dates: NSSDCA mission pages. No `point`: there
  # is no PGDA product 78 tile here, so site_points() (polar sites only) does not list these. dataset_ids stay empty
  # until the global coarse layer (C7) is in the registry.
  - id: apollo-11
    name: Apollo 11 landing site (Lunar Module Eagle descent stage)
    short_name: Apollo 11
    subtitle: Mare Tranquillitatis · 20 July 1969
    category: apollo
    location: {lat: 0.67416, lon: 23.47314}
    description: >-
      Where Apollo 11's lunar module Eagle landed on 20 July 1969 (UT), in Mare Tranquillitatis, the Sea of Tranquility, near the Moon's equator. The point is the lunar
      module's descent stage, which is still on the surface, as located in Lunar Reconnaissance Orbiter
      camera images (Wagner et al. 2017), to within 0.3 m.
    dataset_ids: []
    has_dem_clones: false
    source: >-
      Wagner, R. V., Nelson, D. M., Plescia, J. B., Robinson, M. S., Speyerer, E. J., and Mazarico, E. (2017),
      Coordinates of anthropogenic features on the Moon, Icarus 283, 92-103, doi:10.1016/j.icarus.2016.05.011:
      descent stage of Lunar Module "Eagle", 0.67416 N, 23.47314 E, uncertainty 0.3 m, as listed in the LROC PDS
      archive (LRO-L-LROC-5-RDR-V1.0, EXTRAS/SHAPEFILE/ANTHROPOGENIC_OBJECTS) and on NASA NSSDCA's Apollo
      Landing Site Coordinates page (planetocentric mean Earth/polar axis frame, DE421 ephemeris). Site name and
      landing date: NSSDCA, https://nssdc.gsfc.nasa.gov/planetary/lunar/apollo11info.html.

