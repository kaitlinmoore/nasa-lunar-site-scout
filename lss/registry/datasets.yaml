  - id: iau_gazetteer_moon
    # Stream E (2026-11-16), for landmark labels on the 3D globe (Kaitlin). scripts/fetch_iau_names.py writes
    # LSS_DATA_DIR/cache/features/iau_names.json from the Moon centre-point shapefile (MOON_nomenclature_center_pts
    # .zip; 9,087 names, all "Adopted by IAU", on 2026-11-16). Checked: the shapefile's points equal its
    # center_lat/center_lon fields; Mons Mouton (Feature 16070) matches its Gazetteer page; Statio
    # Tranquillitatis is within 3 m of the Apollo 11 LM position of Wagner et al. (2017) (mean Earth, DE421).
    # Frame: Gazetteer news, 2012-06-04 ("Coordinates of Named Lunar Features Now Available in LOLA Reference
    # Frame"): "referred to the mean Earth/polar axis reference coordinate system for the Moon". Terms: Gazetteer
    # FAQ ("Everything in the Gazetteer of Planetary Nomenclature is in the public domain") and the shapefile
    # metadata (use constraints "Public domain.").
    name: Gazetteer of Planetary Nomenclature, the Moon (IAU WGPSN)
    kind: features
    provider: IAU Working Group for Planetary System Nomenclature / USGS Astrogeology Science Center
    url: https://planetarynames.wr.usgs.gov/Page/MOON/target
    coverage:
      description: Global
      lat_min: -90
      lat_max: 90
    resolution_note: >-
      Feature centres and approximate diameters, for identifying features. The Gazetteer expects its coordinates
      to be precise to 2 decimal places (about 300 m in latitude); some landing-site features are given to 4.
      Planetocentric latitude and east longitude on a sphere, in the LOLA reference frame (mean Earth/polar axis),
      the same frame as the terrain maps used here.
    can_answer:
      - Official IAU names of lunar surface features, with their type, approximate centre and size
      - Which named features are near a location
    cannot_answer:
      - Feature outlines or precise positions (the Gazetteer's positions identify features only)
      - Names not (yet) approved by the IAU, or informal names
      - Geological interpretation of named features (the IAU endorses none)
    citation: >-
      International Astronomical Union Working Group for Planetary System Nomenclature. "Gazetteer of Planetary
      Nomenclature." Accessed 2026-11-16. https://planetarynames.wr.usgs.gov/
    license: Public domain (Gazetteer FAQ and the shapefile metadata; checked 2026-11-16).
    status: planned
    notes: >-
      Only names with approval status "Adopted by IAU" are kept. Satellite features (lettered craters such as
      "Marco Polo P") are 7,064 of the 9,087 names.

  - id: m3_surface_ice
    name: M3 surface-exposed water ice detections (Li et al. 2018)
    kind: features
    provider: Li et al. (Chandrayaan-1 Moon Mineralogy Mapper data)
    url: https://doi.org/10.1073/pnas.1802345115
    coverage:
      description: Polar regions poleward of ~70 (both poles), mostly in permanently shadowed areas
      lat_min: -90
      lat_max: -70
    resolution_m: 280
    can_answer:
      - Locations of surface-exposed ice detections (~280 m pixels), as a labeled stand-in for "water"
    cannot_answer:
      - Subsurface hydrogen at km scale (neutron data are far coarser)
      - Ice abundance or depth
    citation: >-
      Li, S., et al. (2018). Direct evidence of surface exposed water ice in the lunar polar
      regions. PNAS 115(36), 8907-8912. doi:10.1073/pnas.1802345115
    # VERIFY the paper's supplementary data terms.
    license: Not yet checked (paper supplementary data terms)
    status: planned

  - id: orbital_neutron_hydrogen
    name: Orbital neutron hydrogen maps (Lunar Prospector Neutron Spectrometer; LRO LEND)
    kind: other
    provider: NASA Lunar Prospector and LRO missions (PDS)
    url: https://ode.rsl.wustl.edu/moon/pagehelp/Content/Missions_Instruments/LRO/LEND/Intro.htm
    coverage:
      description: Global orbital coverage; polar hydrogen enhancements at both poles
      lat_min: -90
      lat_max: 90
    resolution_m: null
    resolution_note: >-
      Far coarser than a landing site. Lunar Prospector NS footprint ~45 km FWHM from the low-altitude
      orbit (~130 km from the high orbit); reconstructions reach ~13-20 km. LRO LEND collimated: ~10 km
      claimed (5 km design goal), disputed in the literature.
    cannot_answer:
      - Hydrogen concentration at ~1 km scale (orbital neutron maps resolve ~10 km at best)
    citation: >-
      Feldman, W. C., et al. (1998). Fluxes of fast and epithermal neutrons from Lunar Prospector:
      evidence for water ice at the lunar poles. Science 281, 1496-1500. doi:10.1126/science.281.5382.1496.
      Mitrofanov, I. G., et al. (2010). Hydrogen mapping of the lunar south pole using the LRO neutron
      detector experiment LEND. Science 330, 483-486. doi:10.1126/science.1185696
    license: NASA PDS data (U.S. Government work).
    status: dropped
    notes: >-
      Not integrated: neutron maps cannot resolve site-scale hydrogen. Listed so the limit can be cited.
      The labelled stand-in is m3_surface_ice (~280 m). Resolution figures: Eke, V. R., Teodoro, L. F. A.,
      & Elphic, R. C. (2009), Icarus 200(1), 12-18, doi:10.1016/j.icarus.2008.10.013 (LP NS footprint and
      reconstruction); Teodoro, L. F. A., Eke, V. R., Elphic, R. C., Feldman, W. C., & Lawrence, D. J. (2014),
      JGR Planets 119(3), 574-593, doi:10.1002/2013JE004421 (the LEND resolution debate).
    # Plan question 9. VERIFY the PDS product pages for both instruments before the references list cites them.

