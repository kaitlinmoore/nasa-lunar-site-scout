# SI-assisted: generated with Claude (Anthropic) and reviewed by the project author. See README "AI usage".
#
# Dataset capability registry (plan section 3.4). One entry per dataset.
# Drives: fidelity labels in the UI, the NL layer's "can't answer, because..." responses,
# and the submission's References / NASA Data fields. Mirrored in reference/challenge-resources.md Part 2.
#
# Schema: lss.contract.DatasetCapability. Coordinates: planetocentric deg, east-positive lon.
# status: planned | used | dropped.  "VERIFY:" marks facts not yet checked against the source.

datasets:
  - id: pgda_78_site_dems
    name: High-Resolution LOLA Topography for South Pole Sites (5 m site DEMs + 100 clones)
    kind: terrain
    provider: NASA GSFC PGDA (M. K. Barker)
    url: https://pgda.gsfc.nasa.gov/products/78
    coverage:
      description: ~27 south-pole sites (Mazarico et al. 2011 numbering), each a local DEM tile
      sites_only: true
    resolution_m: 5
    can_answer:
      - Near-field horizon at listed PGDA sites
      - Slope and terrain at listed PGDA sites
      - DEM uncertainty spread at sites with clones (Site01, 04, 06, 07, 11, 20, 20v2, 23 confirmed)
    cannot_answer:
      - Anything outside the site tiles
      - Far-field horizon (tiles are too small; combine with product 90)
    citation: >-
      Barker, M. K., et al. (2021). Improved LOLA elevation maps for south pole landing sites:
      Error estimates and their impact on illumination conditions. Planetary and Space Science 203,
      105119. doi:10.1016/j.pss.2020.105119
    license: NASA-produced data (U.S. Government work). No license stated; the PGDA Data Usage Policy asks users to cite the paper (Barker et al. 2021) (checked 2026-11-15).
    status: used
    notes: >-
      South polar stereographic X/Y m, MOON_ME / DE421. VERIFY which sites beyond the 8 listed have clones.
      Used (C1): Site01_final_adj_5mpp_surf.tif, 3200 x 3200 px float32 (NaN nodata), PS x -19..-3 km,
      y -20..-4 km on the 1737.4 km sphere (checked 2026-11-14). Fetched by scripts/fetch_data.py.

  - id: pgda_81_mosaic_5m
    name: South Pole LOLA 5 m/pix DEM mosaic, 87-90 S
    kind: terrain
    provider: NASA GSFC PGDA (M. K. Barker)
    url: https://pgda.gsfc.nasa.gov/products/81
    coverage:
      description: South polar cap poleward of 87 S
      lat_min: -90
      lat_max: -87
    resolution_m: 5
    resolution_note: ~90% of 5 m pixels are interpolated (Barker); small-scale features are low confidence
    can_answer:
      - Near-field horizon anywhere poleward of 87 S
      - Slope / flat-area screening poleward of 87 S (low confidence at single-pixel scale)
    cannot_answer:
      - High-confidence single-pixel slope (~90% of 5 m pixels are interpolated)
      - Terrain equatorward of 87 S
      - Hazards smaller than a few pixels (e.g. sub-meter boulders)
    citation: >-
      Barker, M. K., et al. (2021). Planetary and Space Science 203, 105119.
      doi:10.1016/j.pss.2020.105119
    license: NASA-produced data (U.S. Government work). No license stated; the PGDA Data Usage Policy asks users to cite the paper (Barker et al. 2021) (checked 2026-11-15).
    status: planned
    notes: Data at https://pgda.gsfc.nasa.gov/data/LOLA_5mpp/87S/. MOON_ME / DE421.

  - id: pgda_90_south_pole_dems
    name: A New View of the Lunar South Pole from LOLA (large-area south polar DEMs)
    kind: terrain
    provider: NASA GSFC PGDA (M. K. Barker)
    url: https://pgda.gsfc.nasa.gov/products/90
    coverage:
      description: >-
        South polar DEMs to 60 S (60/120/240 m), 75 S (30 m), 80 S (20/40/80 m), 83 S (10 m);
        the 20 m product covers 80-90 S
      lat_min: -90
      lat_max: -60
    resolution_m: 20
    resolution_note: 20 m for 80-90 S; 10 m to 83 S; coarser products farther out
    can_answer:
      - Far-field horizon for south-pole sites (terrain >100 km away)
      - Near-field terrain where no 5 m product exists (80-87 S at 20 m)
    cannot_answer:
      - Northern hemisphere or mid-latitude terrain
      - Flat areas smaller than one pixel (20 m pixel = 400 m²) equatorward of 87°S
    citation: >-
      Barker, M. K., et al. (2023). A New View of the Lunar South Pole from the Lunar Orbiter Laser
      Altimeter (LOLA). Planetary Science Journal 4(9), 183. doi:10.3847/PSJ/acf3e1.
      Data: doi:10.60903/gsfcpgda-lola-spole
    license: NASA-produced data (U.S. Government work). No license stated; the PGDA Data Usage Policy asks users to cite the paper (Barker et al. 2023) (checked 2026-11-15).
    status: used
    notes: >-
      Cloud-optimized GeoTIFFs (windowed remote reads), south polar stereographic, MOON_ME / DE421.
      Checked 2026-11-14: float32, NaN nodata, deflate, tiled; CRS is polar stereographic true at the pole
      on a 1737.4 km sphere. Used (C1): LDEM_80S_80MPP_ADJ (80 m, +-304 km) and LDEM_60S_240MPP_ADJ
      (240 m, +-931 km) as far field; a +-150 km window of LDEM_60S_60MPP_ADJ (60 m) for the internal
      product 69 comparison only. Fetched by scripts/fetch_data.py.

  - id: pgda_69_polar_illumination
    name: Lunar Polar Illumination (18.6-year averaged solar illumination, Earth and sky visibility)
    kind: illumination
    provider: NASA GSFC PGDA (E. Mazarico)
    url: https://pgda.gsfc.nasa.gov/products/69
    coverage:
      description: Both poles, 65-90 (240 m), 75-90 (120 m), 85-90 (60 m); sky visibility 65-90 only
      lat_min: -90
      lat_max: -65
    resolution_m: 60
    resolution_note: 60 m (85-90), 120 m (75-90), 240 m (65-90). Northern counterparts also exist.
    can_answer:
      - Validation of long-term average illumination and Earth visibility at sample points
      - Permanent shadow (PSR) maps
    cannot_answer:
      - Conditions for a specific date window (long-term averages)
      - Any height above the surface (the observer height is not stated; most likely surface level)
    citation: >-
      Mazarico, E., et al. (2011). Illumination conditions of the lunar polar regions using LOLA
      topography. Icarus 211(2), 1066-1081. doi:10.1016/j.icarus.2010.10.030
    license: NASA-produced data (U.S. Government work); cite Mazarico et al. 2011.
    status: used
    notes: >-
      Used for validation only (internal; never served). Polar stereographic, reference radius 1737.4 km.
      PDS labels (2016 release, from LDEM_85S_060M): value = fraction of time steps with any part of the
      solar (or Earth) disc visible; DN x 0.00004. No observer height or averaging dates are stated in
      the page, labels or README (checked 2026-11-14). The product page says "hourly timesteps spanning
      18.6 years" (the citable source for the period; Mazarico et al. 2011 used several 18.6-year cycles at
      6 h on 240 m maps). Dates not stated: the validation measures the start-date sensitivity with two
      starts, 2000-01-01 and 2024-01-01 (docs/methodology.md sections 4.2 and 6.3).

  - id: pgda_98_polar_roughness
    name: Large-Scale Roughness Properties of the Lunar Poles
    kind: terrain
    provider: NASA GSFC PGDA (M. K. Barker)
    url: https://pgda.gsfc.nasa.gov/products/98
    coverage:
      description: Lunar polar regions; roughness at baselines ~50-1000 m. VERIFY south-pole coverage (98 vs 90)
    resolution_m: 50
    resolution_note: Multiple roughness baselines (~50-1000 m). VERIFY grid spacing.
    can_answer:
      - Hazard context from LOLA roughness at tens-of-meters to km baselines
    cannot_answer:
      - Individual boulders or meter-scale hazards
    citation: >-
      Barker, M. K., et al. (2025). Large-Scale Roughness Properties of the Lunar North and South
      Polar Regions as Measured by LOLA. Planetary Science Journal 6, 83. doi:10.3847/PSJ/adbc9d.
      Data: doi:10.60903/gsfcpgda-lola-poles
    license: NASA-produced data (U.S. Government work). No license stated; the PGDA Data Usage Policy asks users to cite the paper (Barker et al. 2025) (checked 2026-11-15).
    status: planned

  - id: lola_ldem_128
    name: LOLA global gridded DEM, LDEM_128 (candidate coarse global layer)
    kind: terrain
    provider: NASA LRO LOLA / PDS Geosciences Node
    url: https://pds-geosciences.wustl.edu/missions/lro/lola.htm
    coverage:
      description: Global
      lat_min: -90
      lat_max: 90
    resolution_m: 237
    resolution_note: 128 pixels/degree (~237 m at the equator)
    can_answer:
      - Coarse horizon and terrain anywhere on the Moon (fidelity label "low")
    cannot_answer:
      - Fine-scale horizon or slope at sub-kilometer scale
    citation: >-
      Smith, D. E., et al. (2010). Initial observations from the Lunar Orbiter Laser Altimeter
      (LOLA). Geophysical Research Letters 37(18). doi:10.1029/2010GL043751. VERIFY the article id
      (Crossref gives 2010GL043751; L18204 not confirmed) and the preferred citation for LDEM_128.
    license: NASA PDS data (U.S. Government work).
    status: planned
    notes: Candidate only (plan section 4.2); confirm product choice and frame in C7.

  - id: sldem2015
    name: SLDEM2015 (LOLA + SELENE Terrain Camera merged DEM)
    kind: terrain
    provider: NASA GSFC (M. K. Barker et al.) / PDS
    url: https://pgda.gsfc.nasa.gov/products/54
    coverage:
      description: 60 S to 60 N
      lat_min: -60
      lat_max: 60
    resolution_m: 59
    resolution_note: 512 pixels/degree (~59 m at the equator)
    can_answer:
      - Mid-latitude horizon and slope at ~60 m (Strong tier, S2a)
    cannot_answer:
      - Polar terrain poleward of 60
    citation: >-
      Barker, M. K., et al. (2016). A new lunar digital elevation model from the Lunar Orbiter Laser
      Altimeter and SELENE Terrain Camera. Icarus 273, 346-355. doi:10.1016/j.icarus.2015.07.039
    license: NASA-produced data (U.S. Government work). No license stated; the PGDA Data Usage Policy asks users to cite the paper (Barker et al. 2016) (checked 2026-11-15). URL checked (page title "High-resolution Lunar Topography (SLDEM2015)").
    status: planned
    notes: VERIFY SLDEM2015 frame vs MOON_ME (plan section 9).

  - id: diviner_polar_temperature
    name: LRO Diviner polar temperature products (PCP / PRP)
    kind: thermal
    provider: NASA LRO Diviner / PDS Geosciences Node
    url: https://pds-geosciences.wustl.edu/missions/lro/diviner.htm
    coverage:
      description: Polar regions poleward of 80 (both poles)
      lat_min: -90
      lat_max: -80
    resolution_m: 240
    resolution_note: VERIFY grid spacing and seasonal/local-time binning
    can_answer:
      - Typical surface temperature range by season and time of day poleward of 80 (S5)
    cannot_answer:
      - Temperatures equatorward of 80° (the tool has not integrated a Diviner product for that range)
      - Spacecraft thermal or battery-heating requirements (needs a spacecraft thermal model)
    citation: >-
      Williams, J.-P., et al. (2019). Seasonal polar temperatures on the Moon. JGR Planets 124,
      2505-2521. doi:10.1029/2019JE006028. VERIFY product names and citation.
    license: NASA PDS data (U.S. Government work).
    status: planned

  - id: robbins_craters
    name: Robbins global lunar crater database (craters >1-2 km)
    kind: features
    provider: S. J. Robbins / USGS Astrogeology
    url: https://astrogeology.usgs.gov/search/map/moon_crater_database_v1_robbins
    coverage:
      description: Global
      lat_min: -90
      lat_max: 90
    resolution_m: 1000
    resolution_note: Complete for craters >=1-2 km diameter
    can_answer:
      - Crater locations and diameters >=1-2 km; proximity to craters
    cannot_answer:
      - Craters smaller than ~1 km
    citation: >-
      Robbins, S. J. (2019). A new global database of lunar impact craters >1-2 km: 1. Crater
      locations and sizes, comparisons with published databases, and global analysis. JGR Planets
      124, 871-892. doi:10.1029/2018JE005592
    license: VERIFY (USGS Astrogeology distribution terms; the page refuses automated requests, check by hand).
    status: planned

  - id: m3_surface_ice
    name: M3 surface-exposed water ice detections (Li et al. 2018)
    kind: features
    provider: Li et al. (Chandrayaan-1 Moon Mineralogy Mapper data)
    url: https://doi.org/10.1073/pnas.1802345115
    coverage:
      description: Polar regions poleward of ~70 (both poles), mostly in permanently shadowed areas
      lat_min: -90
      lat_max: -70
    resolution_m: 280
    can_answer:
      - Locations of surface-exposed ice detections (~280 m pixels), as a labeled stand-in for "water"
    cannot_answer:
      - Subsurface hydrogen at km scale (neutron data are far coarser)
      - Ice abundance or depth
    citation: >-
      Li, S., et al. (2018). Direct evidence of surface exposed water ice in the lunar polar
      regions. PNAS 115(36), 8907-8912. doi:10.1073/pnas.1802345115
    license: VERIFY (paper supplementary data terms).
    status: planned

  - id: orbital_neutron_hydrogen
    name: Orbital neutron hydrogen maps (Lunar Prospector Neutron Spectrometer; LRO LEND)
    kind: other
    provider: NASA Lunar Prospector and LRO missions (PDS)
    url: https://ode.rsl.wustl.edu/moon/pagehelp/Content/Missions_Instruments/LRO/LEND/Intro.htm
    coverage:
      description: Global orbital coverage; polar hydrogen enhancements at both poles
      lat_min: -90
      lat_max: 90
    resolution_m: null
    resolution_note: >-
      Far coarser than a landing site. Lunar Prospector NS footprint ~45 km FWHM from the low-altitude
      orbit (~130 km from the high orbit); reconstructions reach ~13-20 km. LRO LEND collimated: ~10 km
      claimed (5 km design goal), disputed in the literature.
    cannot_answer:
      - Hydrogen concentration at ~1 km scale (orbital neutron maps resolve ~10 km at best)
    citation: >-
      Feldman, W. C., et al. (1998). Fluxes of fast and epithermal neutrons from Lunar Prospector:
      evidence for water ice at the lunar poles. Science 281, 1496-1500. Mitrofanov, I. G., et al. (2010).
      Hydrogen mapping of the lunar south pole using the LRO neutron detector experiment LEND.
      Science 330, 483-486.
    license: NASA PDS data (U.S. Government work).
    status: dropped
    notes: >-
      Not integrated: neutron maps cannot resolve site-scale hydrogen (plan question 9). Listed so the
      limit can be cited. The labelled stand-in is m3_surface_ice (~280 m). Resolution figures:
      arXiv:0810.2478 (LP NS footprint and reconstruction) and arXiv:1304.8123 (the LEND resolution debate).
      VERIFY the PDS product pages for both instruments before the references list cites them.

  - id: aussel_2025_boulders
    name: Global lunar boulder map from LRO NAC images (Aussel et al. 2025)
    kind: features
    provider: Aussel et al. (University of Muenster)
    url: https://zenodo.org/records/15520275
    coverage:
      description: 60 S to 60 N only (does not cover the poles)
      lat_min: -60
      lat_max: 60
    resolution_m: null
    resolution_note: Boulder density maps by size bin; detection limited by NAC resolution (VERIFY minimum size)
    can_answer:
      - Boulder density and mean boulder size between 60 S and 60 N
    cannot_answer:
      - Any boulder information at the poles
      - Individual sub-meter boulders in a landing ellipse
    citation: >-
      Aussel, B., et al. (2025). Global lunar boulder map from LRO NAC optical images using deep
      learning: Implications for regolith and protolith. JGR Planets 130(7), e2025JE008981.
      doi:10.1029/2025JE008981. Data: doi:10.5281/zenodo.15520275 (Zenodo, version 3)
    license: CC BY 4.0 (Zenodo record page)
    status: planned

  - id: spice_de421
    name: NAIF SPICE kernels, DE421 era (planetary ephemeris + lunar orientation)
    kind: ephemeris
    provider: NASA JPL NAIF
    url: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/
    coverage:
      description: >-
        Sun/Earth/Moon geometry in MOON_ME. Limited by the lunar orientation kernel:
        1900-01-01 to 2051-01-01 00:00:00 TDB (= 2050-12-31 23:58:50.816 UTC with no further leap
        seconds). DE421 SPK covers 1899-07-29 to 2053-10-09 TDB.
    resolution_m: null
    can_answer:
      - Sun and Earth direction at any site and time 1900-2050 (UTC), in the DEMs' MOON_ME frame
    cannot_answer:
      - Dates after 2050-12-31 23:58:50 UTC (orientation kernel end); needs newer kernels + frame alignment (X5)
    citation: >-
      Folkner, W. M., Williams, J. G., & Boggs, D. H. (2008). The Planetary and Lunar Ephemeris DE 421.
      JPL IOM 343R-08-003. Acton, C. H. (1996). Ancillary data services of NASA's Navigation and
      Ancillary Information Facility. Planetary and Space Science 44(1), 65-70.
      doi:10.1016/0032-0633(95)00107-7. Acton, C., Bachman, N., Semenov, B., & Wright, E. (2018). A look
      towards the future in the handling of space science mission geometry. Planetary and Space Science
      150, 9-12. doi:10.1016/j.pss.2017.02.013
    license: NAIF generic kernels are freely available (U.S. Government work).
    status: used
    notes: >-
      Files: de421.bsp (NAIF now serves it from spk/planets/a_old_versions/), moon_pa_de421_1900-2050.bpc,
      moon_080317.tf, moon_assoc_me.tf, naif0012.tls, pck00010.tpc. Coverage measured from the files
      with spiceypy (2026-11-14). Stored in LSS_DATA_DIR/kernels (gitignored); fetched by
      scripts/fetch_data.py.

  # Not a dataset: the tool's own limits, so refusal reasons have one source (Kaitlin, 2026-11-15).
  # Lists of data sources (References, NASA Data) skip this entry: provider "This project".
  - id: lss_tool_capabilities
    name: Lunar Site Scout tool capabilities (not a dataset)
    kind: other
    provider: This project
    url: https://github.com/kaitlinmoore/nasa-lunar-site-scout
    coverage:
      description: Limits of the tool itself, not of any dataset
    cannot_answer:
      - Time-dependent area search (not available yet)
      - Temperature queries (not available yet)
      - Drive routes or traverse distances (distances are straight-line)
      - Sun angle along a descent trajectory (Sun elevation is computed at the site)
      - Questions outside lunar landing-site planning
    citation: This project (not a dataset)
    license: Apache-2.0
    status: used
