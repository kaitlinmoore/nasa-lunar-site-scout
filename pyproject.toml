[project]
name = "nasa-lunar-site-scout"
version = "0.1.0"
description = "Terrain-aware lunar landing site planner: sunlight and direct-to-Earth comms windows from LOLA topography and JPL ephemerides."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "spiceypy>=8.4.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lss"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
